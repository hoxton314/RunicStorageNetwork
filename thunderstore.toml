[config]
schemaVersion = "0.0.1"

[package]
namespace = "Rerit"
name = "RunicStorageNetwork"
# The workflow substitutes the validated version in a temporary config copy.
versionNumber = "0.0.0"
description = "Runic Storage Network for Valheim"
